# AI Eval Platform — Nginx 生产部署配置
#
# 用法:
#   1. 构建前端: cd web && npm run build
#   2. 构建后端: go build -o server ./cmd/server/
#   3. 将 web/dist 复制到 /var/www/ai-eval/
#   4. 将 server 二进制部署到 /opt/ai-eval/
#   5. 使用 systemd 或 supervisor 管理 server 进程
#   6. 应用此 nginx 配置

upstream ai_eval_backend {
    server 127.0.0.1:8080;
    keepalive 64;
}

server {
    listen 80;
    server_name eval.example.com;

    # 前端静态文件
    root /var/www/ai-eval;
    index index.html;

    # 开启 gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;
    gzip_comp_level 6;

    # API 请求 → 后端
    location /api/ {
        proxy_pass http://ai_eval_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;

        # WebSocket 支持
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
    }

    # WebSocket 端点
    location /api/tasks/ {
        proxy_pass http://ai_eval_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    # 静态资源(浏览器缓存)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: 非文件请求返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

